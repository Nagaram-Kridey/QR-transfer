[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lumenlink"
version = "0.1.0.dev0"
description = "Experimental offline screen-to-camera file transfer reference implementation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["segno>=1.6,<2", "opencv-python>=4.10,<5", "zxing-cpp>=2.3,<4"]

[project.scripts]
lumenlink = "lumenlink.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/lumenlink"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lumenlink"]

[[tool.mypy.overrides]]
module = ["segno", "cv2", "zxingcpp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["lumenlink"]
omit = ["*/cli.py", "*/qr_io.py", "*/sim.py", "*/benchmark.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
